- period: "May 2024 - January 2026"
  role: "Fullstack Developer"
  organization: "BakerRisk"
  summary: >-
    Built new engineering tools, internal systems and modernized legacy
    applications. Improved reliability through automated testing and data
    safeguards. Owned projects from conceptualization to delivery, working
    closely with SMEs.
  skills:
    - C#
    - .NET
    - VBA
    - WPF
    - MySQL
    - TypeScript
    - Next.js
    - PDFSharp
    - Azure
  project_stories:
    - title: "PDFTool"
      body: >-
        Preparing structural engineering reports meant creating tables individually
        in Excel, taking hundreds of billable hours per project. I developed a PDF
        library that generated these tables from existing engineering data, adapting
        them to the methodology used in each assessment. This streamlined report
        preparation and saved the company approximately $25,000 a year in billable time.

    - title: "Data Collection Tool"
      body: >-
        After each site visit, engineers had to transcribe their digital notes and
        manually enter data into risk assessment software. I worked closely
        with them to build an on-site note-taking tool with an export function,
        allowing the collected data to be transferred directly into risk assessment software. 
        This reduced project turnaround time and saved approximately $10,000 per engineering project.

