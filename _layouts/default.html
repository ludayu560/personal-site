<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <title>
    {%- if page.title -%}
      {{ page.title | escape }} ·
    {%- endif -%}
    {{ site.title | escape }}
  </title>

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>

<body{% if page.home %} class="home-page"{% endif %}>
  <div class="container">
    {% unless page.home %}
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
          {{ site.title | escape }}
        </a>

        <nav aria-label="Main navigation">
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/blog/' | relative_url }}">Writing</a>
        </nav>
      </header>
    {% endunless %}

    <main{% if page.home %} class="home-main"{% endif %}>
      {{ content }}
    </main>
  </div>
</body>
</html>
